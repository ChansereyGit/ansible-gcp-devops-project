---
# ============================================================================
# Role: nexus
# Purpose: Install and configure Nexus Repository Manager using Docker
# ============================================================================

- name: Create Nexus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "/home/{{ ansible_user }}/nexus"
    - "/home/{{ ansible_user }}/nexus/data"

- name: Set ownership for Nexus data directory (nexus user UID 200)
  file:
    path: "/home/{{ ansible_user }}/nexus/data"
    state: directory
    owner: "200"
    group: "200"
    mode: '0755'
    recurse: yes

- name: Copy Nexus docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "/home/{{ ansible_user }}/nexus/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Copy Nexus environment file
  template:
    src: nexus.env.j2
    dest: "/home/{{ ansible_user }}/nexus/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Copy Nexus setup documentation
  copy:
    src: nexus-setup.md
    dest: "/home/{{ ansible_user }}/nexus/SETUP.md"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Reset SSH connection to apply docker group membership
  meta: reset_connection

- name: Start Nexus container
  community.docker.docker_compose_v2:
    project_src: "/home/{{ ansible_user }}/nexus"
    state: present
    pull: always
  become: yes
  become_user: "{{ ansible_user }}"

- name: Wait for Nexus to start
  wait_for:
    host: localhost
    port: "{{ nexus_port }}"
    delay: 20
    timeout: 600
    state: started

- name: Wait for Nexus to be fully ready (additional 60 seconds)
  pause:
    seconds: 60
    prompt: "Waiting for Nexus to fully initialize..."

- name: Check if Nexus admin password file exists
  stat:
    path: "/home/{{ ansible_user }}/nexus/data/admin.password"
  register: nexus_admin_password_file

- name: Read Nexus initial admin password
  slurp:
    src: "/home/{{ ansible_user }}/nexus/data/admin.password"
  register: nexus_password_content
  when: nexus_admin_password_file.stat.exists
  become: yes

- name: Display Nexus initial password
  debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "✓ Nexus Repository installed successfully!"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Access Nexus at: http://{{ ansible_default_ipv4.address }}:{{ nexus_port }}"
      - ""
      - "Initial credentials:"
      - "  Username: admin"
      - "  Password: {{ nexus_password_content['content'] | b64decode | trim }}"
      - ""
      - "Docker Registry Port: {{ nexus_docker_port }}"
      - ""
      - "⚠️  Save this password! You'll need it for initial setup."
      - "⚠️  Change the password immediately after first login!"
      - ""
      - "Data directory: /home/{{ ansible_user }}/nexus/data"
      - "Setup guide: /home/{{ ansible_user }}/nexus/SETUP.md"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  when: nexus_admin_password_file.stat.exists

- name: Display Nexus info (no password file)
  debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "✓ Nexus Repository installed successfully!"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Access Nexus at: http://{{ ansible_default_ipv4.address }}:{{ nexus_port }}"
      - ""
      - "Note: Password file not found yet. Nexus may still be initializing."
      - "Check: /home/{{ ansible_user }}/nexus/data/admin.password"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  when: not nexus_admin_password_file.stat.exists

- name: Create Nexus systemd service for auto-start
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus-docker.service
    mode: '0644'

- name: Enable Nexus systemd service
  systemd:
    name: nexus-docker
    enabled: yes
    daemon_reload: yes

- name: Display Nexus configuration info
  debug:
    msg:
      - "Nexus is running on port {{ nexus_port }}"
      - "Docker registry port: {{ nexus_docker_port }}"
      - "Domain will be configured: {{ nexus_domain }}"
      - "Data directory: /home/{{ ansible_user }}/nexus/data"
