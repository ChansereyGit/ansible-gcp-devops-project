---
# ============================================================================
# Role: certbot
# Purpose: Install Certbot and configure Let's Encrypt SSL certificates
# ============================================================================

- name: Install Certbot and Nginx plugin
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes

- name: Create webroot directory for ACME challenge
  file:
    path: /var/www/html/.well-known/acme-challenge
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
    recurse: yes

- name: Ensure Nginx is running
  systemd:
    name: nginx
    state: started

- name: Check if certificate already exists for Jenkins
  stat:
    path: "/etc/letsencrypt/live/{{ jenkins_domain }}/fullchain.pem"
  register: jenkins_cert
  when: "'jenkins' in group_names"

- name: Check if certificate already exists for SonarQube
  stat:
    path: "/etc/letsencrypt/live/{{ sonarqube_domain }}/fullchain.pem"
  register: sonarqube_cert
  when: "'sonarqube' in group_names"

- name: Check if certificate already exists for Nexus
  stat:
    path: "/etc/letsencrypt/live/{{ nexus_domain }}/fullchain.pem"
  register: nexus_cert
  when: "'nexus' in group_names"

- name: Get external IP address
  uri:
    url: https://api.ipify.org?format=json
    return_content: yes
  register: external_ip_response
  changed_when: false

- name: Set external IP fact
  set_fact:
    vm_external_ip: "{{ external_ip_response.json.ip }}"

- name: Check DNS resolution
  shell: dig +short {{ jenkins_domain if 'jenkins' in group_names else sonarqube_domain if 'sonarqube' in group_names else nexus_domain }}
  register: dns_check
  changed_when: false
  failed_when: false

- name: Display DNS check result
  debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "DNS Check:"
      - "{% if 'jenkins' in group_names %}Domain: {{ jenkins_domain }}{% endif %}{% if 'sonarqube' in group_names %}Domain: {{ sonarqube_domain }}{% endif %}{% if 'nexus' in group_names %}Domain: {{ nexus_domain }}{% endif %}"
      - "Resolves to: {{ dns_check.stdout | default('Not resolved') }}"
      - "VM External IP: {{ vm_external_ip }}"
      - "VM Internal IP: {{ ansible_default_ipv4.address }}"
      - "Match: {{ 'YES ✓' if vm_external_ip in dns_check.stdout else 'NO ✗ - DNS may not be configured correctly' }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Wait for DNS propagation if needed
  pause:
    prompt: |
      
      ⚠️  IMPORTANT: Ensure DNS is configured correctly before proceeding!
      
      {% if 'jenkins' in group_names %}Jenkins:    {{ jenkins_domain }} → {{ vm_external_ip }}{% endif %}
      {% if 'sonarqube' in group_names %}SonarQube: {{ sonarqube_domain }} → {{ vm_external_ip }}{% endif %}
      {% if 'nexus' in group_names %}Nexus:     {{ nexus_domain }} → {{ vm_external_ip }}{% endif %}
      
      If DNS is not configured yet:
      1. Go to your DNS provider (Namecheap)
      2. Add/Update A records to point to the IPs above
      3. Disable Cloudflare proxy (gray cloud ☁️, not orange 🟠)
      4. Wait 2-3 minutes for propagation
      
      Press Enter to continue when DNS is ready (Ctrl+C to abort)...
  when: vm_external_ip not in dns_check.stdout

- name: Obtain SSL certificate for Jenkins
  command: >
    certbot --nginx
    -d {{ jenkins_domain }}
    --non-interactive
    --agree-tos
    -m {{ letsencrypt_email }}
    --redirect
  when:
    - "'jenkins' in group_names"
    - not jenkins_cert.stat.exists
    - vm_external_ip in dns_check.stdout
  register: jenkins_certbot_result
  ignore_errors: yes

- name: Obtain SSL certificate for SonarQube
  command: >
    certbot --nginx
    -d {{ sonarqube_domain }}
    --non-interactive
    --agree-tos
    -m {{ letsencrypt_email }}
    --redirect
  when:
    - "'sonarqube' in group_names"
    - not sonarqube_cert.stat.exists
    - vm_external_ip in dns_check.stdout
  register: sonarqube_certbot_result
  ignore_errors: yes

- name: Obtain SSL certificate for Nexus
  command: >
    certbot --nginx
    -d {{ nexus_domain }}
    --non-interactive
    --agree-tos
    -m {{ letsencrypt_email }}
    --redirect
  when:
    - "'nexus' in group_names"
    - not nexus_cert.stat.exists
    - vm_external_ip in dns_check.stdout
  register: nexus_certbot_result
  ignore_errors: yes

- name: Display SSL certificate results
  debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "SSL Certificate Status:"
      - "{% if 'jenkins' in group_names %}Jenkins:    {% if jenkins_certbot_result is succeeded %}✓ Obtained{% elif jenkins_cert.stat.exists %}✓ Already exists{% elif vm_external_ip not in dns_check.stdout %}⚠ Skipped - DNS not configured{% else %}✗ Failed - Check logs{% endif %}{% endif %}"
      - "{% if 'sonarqube' in group_names %}SonarQube: {% if sonarqube_certbot_result is succeeded %}✓ Obtained{% elif sonarqube_cert.stat.exists %}✓ Already exists{% elif vm_external_ip not in dns_check.stdout %}⚠ Skipped - DNS not configured{% else %}✗ Failed - Check logs{% endif %}{% endif %}"
      - "{% if 'nexus' in group_names %}Nexus:     {% if nexus_certbot_result is succeeded %}✓ Obtained{% elif nexus_cert.stat.exists %}✓ Already exists{% elif vm_external_ip not in dns_check.stdout %}⚠ Skipped - DNS not configured{% else %}✗ Failed - Check logs{% endif %}{% endif %}"
      - ""
      - "{% if vm_external_ip not in dns_check.stdout %}⚠️  SSL certificates skipped because DNS is not configured correctly.{% endif %}"
      - "{% if vm_external_ip not in dns_check.stdout %}   To obtain certificates manually, SSH into each VM and run:{% endif %}"
      - "{% if vm_external_ip not in dns_check.stdout %}   sudo certbot --nginx -d YOUR_DOMAIN --non-interactive --agree-tos -m {{ letsencrypt_email }}{% endif %}"
      - "{% if vm_external_ip not in dns_check.stdout %}   Or use: just setup-ssl{% endif %}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Setup auto-renewal with cron
  cron:
    name: "Certbot automatic renewal"
    minute: "{{ certbot_auto_renew_minute | default('30') }}"
    hour: "{{ certbot_auto_renew_hour | default('3') }}"
    job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"
    user: root
    state: present

- name: Test certificate renewal (dry run)
  command: certbot renew --dry-run
  register: certbot_test
  changed_when: false
  failed_when: false

- name: Display renewal test result
  debug:
    msg: "{{ '✓ Certificate renewal test successful' if certbot_test.rc == 0 else '⚠️  Certificate renewal test failed - This is normal if DNS is not configured yet' }}"
