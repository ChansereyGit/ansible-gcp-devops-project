---
# ============================================================================
# Task: Install Portainer
# Purpose: Install Portainer Docker UI management tool
# ============================================================================

- name: Create Portainer volume
  docker_volume:
    name: portainer_data
    state: present

- name: Run Portainer container
  docker_container:
    name: portainer
    image: portainer/portainer-ce:latest
    state: started
    restart_policy: always
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

- name: Wait for Portainer to be ready
  wait_for:
    host: localhost
    port: 9443
    delay: 5
    timeout: 60

- name: Display Portainer info
  debug:
    msg:
      - "✓ Portainer installed successfully"
      - "Access Portainer at: https://{{ ansible_default_ipv4.address }}:9443"
      - "Initial setup required on first access"
